[package]
name = "grand_conquest_app"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "system_fonts", "clipboard"] }
egui = "0.37"
grand_conquest_core = { path = "../grand_conquest_core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
include_dir = "0.7"
rand = "0.8"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
